[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velociwrap"
version = "1.0.0"
description = "A lightweight python package to create velocity-consistent channel maps and position-velocity (PV) diagrams from astronomical datacube."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Janette Suherli" }
]
keywords = ["astronomy", "datacube", "velocity", "channel maps", "integral field spectroscopy", "FITS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "astropy",
    "regions",
    "pillow",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Documentation = "https://jsuherli.github.io/velociwrap/"
Repository = "https://github.com/jsuherli/velociwrap"
Issues = "https://github.com/jsuherli/velociwrap/issues"

[tool.setuptools.packages.find]
include = ["velociwrap*"]

[tool.setuptools.package-data]
velociwrap = ["data/*.fits", "data/*.reg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
